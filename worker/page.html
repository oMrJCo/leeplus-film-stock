function showLogin(message=''){U=null;S=null;selectedRecord='';draft=[];document.body.classList.remove('staff-mode');document.body.classList.add('login-mode');$('nav').innerHTML='';$('identity').textContent='';$('modeLink').innerHTML='';$('app').innerHTML='<div class="card login-card"><div class="login-brand">📦 LEEPLUS</div><h1>เข้าใช้งานคลังสินค้า</h1><p class="muted">ใส่เบอร์โทรที่แอดมินลงทะเบียนไว้</p><form id="phoneLoginForm"><label>เบอร์โทร<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxx" required maxlength="20" autofocus></label><p id="loginError" class="count-red" role="alert">'+esc(message)+'</p><button type="submit">เข้าใช้งาน</button></form></div>';$('phoneLoginForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await apiFetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:new FormData(e.target).get('phone')})}),d=await r.json();if(!r.ok){$('loginError').textContent=d.error;return}sessionStorage.setItem(tokenKey(d.realm),d.token);if(!d.admin&&!staffRoute&&typeof location!=='undefined'){location.assign(APP_BASE+'staff/');return}view='overview';await load()}catch(e){$('loginError').textContent='เชื่อมต่อไม่ได้ กรุณาลองใหม่'}finally{button.disabled=false}}}

function staffTaskState(v){if(v==='staffHome')return {active:true,count:0};if(v==='receive'){const boxes=S.boxes.filter(b=>['pending','review'].includes(b.status)&&S.lots.some(l=>l.id===b.lot&&l.status==='draft'));return {active:!!boxes.length,count:boxes.filter(b=>b.status==='pending').length,reason:'รอแอดมินเปิดล็อตรับเข้า'}}if(v==='pick'){const orders=S.orders.filter(o=>o.status==='open');return {active:!!orders.length,count:orders.length,reason:'รอแอดมินสร้างใบเบิก'}}if(v==='counts'){const rounds=S.counts.filter(c=>c.status==='open'&&c.boxes.length);return {active:!!rounds.length,count:rounds.length,reason:'รอแอดมินเปิดรอบพร้อมตรวจนับ'}}return {active:false,count:0,reason:'ไม่มีสิทธิ์เปิดเมนูนี้'}}

function menuPending(id){const draftLots=S.lots.filter(l=>l.status==='draft'),pending=S.boxes.filter(b=>b.status==='pending'&&draftLots.some(l=>l.id===b.lot));if(!U.admin)return id==='receive'?pending.length:id==='pick'?S.orders.filter(o=>o.status==='open').length:id==='counts'?S.counts.filter(c=>c.status==='open').reduce((n,c)=>n+c.boxes.filter(b=>!c.results.some(r=>r.box===b)).length,0):0;switch(id){case 'lots':return draftLots.length;case 'labels':return draftLots.filter(l=>!l.labelsConfirmedAt&&S.boxes.some(b=>b.lot===l.id&&b.status==='pending')).length;case 'receive':return pending.length;case 'approvals':return draftLots.filter(l=>{const bs=S.boxes.filter(b=>b.lot===l.id);return bs.length&&bs.every(b=>b.status==='review')}).length;case 'orders':return S.orders.filter(o=>['open','awaiting_approval'].includes(o.status)).length;case 'pick':return S.orders.filter(o=>o.status==='open').length;case 'counts':return S.counts.filter(c=>['open','review'].includes(c.status)).length;case 'overview':return S.orders.flatMap(o=>o.alloc).filter(x=>x.review==='pending').length;default:return 0}}

const empty=m=>'<div class="empty">'+m+'</div>',table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>',btn=(text,fn,secondary=false)=>'<button class="'+(secondary?'secondary':'')+'" onclick="'+esc(fn)+'">'+text+'</button>',opts=(rows,value='id',label='id')=>rows.map(x=>'<option value="'+esc(x[value])+'">'+esc(typeof label==='function'?label(x):x[label])+'</option>').join(''),sku=()=>'<option value="">เลือกสินค้า</option>'+opts(S.products,'id',x=>pname(x.id));

function importPanel(){return '<div class="card"><h2>นำเข้าข้อมูลสินค้า</h2><p class="muted">Excel (.xlsx / .xls) หรือ CSV • ใช้แผ่นงานแรก • สูงสุด 5,000 รายการ / ไฟล์ 5 MB</p><p>หัวคอลัมน์: <b>รหัสสินค้า, ชื่อสินค้า, รุ่น</b> (รุ่นเว้นว่างได้)</p><p>รหัสใหม่จะเพิ่มสินค้า รหัสเดิมจะอัปเดตชื่อและรุ่น ไม่เปลี่ยนยอดสต็อก</p><div class="actions"><input aria-label="เลือกไฟล์สินค้า" type="file" accept=".csv,.xlsx,.xls" onchange="readProductFile(this.files[0]);this.value=\'\'">'+btn('ดาวน์โหลดไฟล์ตัวอย่าง CSV','productTemplate()',true)+'</div>'+(importLoading?'<p>กำลังอ่านไฟล์…</p>':'')+(importFilename?'<h3>'+esc(importFilename)+'</h3>':'')+(importErrors.length?'<div class="alert">'+importErrors.slice(0,30).map(esc).join('<br>')+'</div>':'')+(importRows.length?'<p>ทั้งหมด '+importRows.length+' รายการ • เพิ่มใหม่ '+importRows.filter(r=>!S.products.some(p=>p.code.toLowerCase()===r.code.toLowerCase())).length+' • อัปเดตรหัสเดิม '+importRows.filter(r=>S.products.some(p=>p.code.toLowerCase()===r.code.toLowerCase())).length+'</p>'+table(['รหัสสินค้า','ชื่อสินค้า','รุ่น','การทำงาน'],importRows.slice(0,100).map(r=>[esc(r.code),esc(r.name),esc(r.model),S.products.some(p=>p.code.toLowerCase()===r.code.toLowerCase())?'อัปเดต':'เพิ่มใหม่']))+(importRows.length>100?'<p class="muted">แสดงตัวอย่าง 100 รายการแรก</p>':'')+(!importErrors.length?'<div class="actions">'+btn('ยืนยันนำเข้า '+importRows.length+' รายการ','confirmProductImport()')+'</div>':''):'')+'</div>'}
function parseProductCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(!quoted&&(c===','||c==='\n'||c==='\r')){row.push(cell);cell='';if(c!==','){if(c==='\r'&&text[i+1]==='\n')i++;rows.push(row);row=[]}}else cell+=c}if(quoted)throw Error('CSV มีเครื่องหมายคำพูดไม่ครบ');if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function productImportPreview(matrix){importRows=[];importErrors=[];const header=(matrix[0]||[]).map(x=>String(x??'').replace(/^\uFEFF/,'').trim().toLowerCase());const find=names=>header.findIndex(x=>names.includes(x));const code=find(['รหัสสินค้า','รหัส','code','sku','product_code','barcode','บาร์โค้ด']),name=find(['ชื่อสินค้า','ชื่อ','name','product_name']),model=find(['รุ่น','model']);if(code<0||name<0){importErrors=['ไม่พบหัวคอลัมน์ รหัสสินค้า และ ชื่อสินค้า'];return}const seen=new Set;for(let i=1;i<matrix.length;i++){const row=matrix[i];if(row.every(x=>String(x??'').trim()===''))continue;const r={code:String(row[code]??'').trim(),name:String(row[name]??'').trim(),model:model<0?'':String(row[model]??'').trim()};if(!r.code||!r.name)importErrors.push('แถวที่ '+(i+1)+': ขาดรหัสหรือชื่อสินค้า');if(r.code.length>100||r.name.length>500||r.model.length>200)importErrors.push('แถวที่ '+(i+1)+': ข้อมูลยาวเกินกำหนด');if(seen.has(r.code.toLowerCase()))importErrors.push('แถวที่ '+(i+1)+': รหัสซ้ำในไฟล์ '+r.code);seen.add(r.code.toLowerCase());importRows.push(r)}if(importRows.length>5000)importErrors.push('นำเข้าได้สูงสุด 5,000 รายการต่อครั้ง');if(!importRows.length)importErrors.push('ไม่พบรายการสินค้าในไฟล์')}
let xlsxLoader;function loadXLSX(){if(window.XLSX)return Promise.resolve();if(!xlsxLoader)xlsxLoader=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';script.onload=()=>resolve();script.onerror=()=>{xlsxLoader=null;script.remove();reject(Error('โหลดตัวอ่าน Excel ไม่สำเร็จ กรุณาลองใหม่ หรือบันทึกไฟล์เป็น CSV'))};document.head.appendChild(script)});return xlsxLoader}
async function readProductFile(file){if(!file||importLoading)return;importFilename=file.name;importRows=[];importErrors=[];importLoading=true;render();try{if(file.size>5*1024*1024)throw Error('ไฟล์ต้องไม่เกิน 5 MB');let rows;if(/\.csv$/i.test(file.name))rows=parseProductCSV(await file.text());else if(/\.xlsx?$/i.test(file.name)){await loadXLSX();const book=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:'',raw:false})}else throw Error('รองรับเฉพาะ Excel หรือ CSV');productImportPreview(rows)}catch(e){importErrors=[e.message]}finally{importLoading=false;render()}}
async function confirmProductImport(){if(importLoading||importErrors.length||!importRows.length)return;const rows=importRows.map(r=>({...r}));if(await action('importProducts',{rows})){importRows=[];importErrors=[];importFilename='';render();toast('นำเข้าสินค้าเรียบร้อย '+rows.length+' รายการ')}}

function itemEditor(){return '<div class="items" id="lines">'+draft.map((x,i)=>'<div class="itemline"><div class="product-picker"><input id="product-search-'+i+'" role="combobox" aria-label="ค้นหาสินค้า" aria-autocomplete="list" aria-expanded="false" aria-controls="product-results-'+i+'" autocomplete="off" placeholder="พิมพ์รหัส / ชื่อสินค้า / รุ่น" value="'+esc(x.product?pname(x.product):'')+'" oninput="draft['+i+'].product=\'\';searchProducts('+i+',this.value)" onfocus="searchProducts('+i+',this.value)" onkeydown="productSearchKey(event,'+i+')"><div id="product-results-'+i+'" class="product-results" role="listbox"></div></div><input aria-label="จำนวนชิ้น" type="number" min="1" placeholder="ชิ้น" value="'+x.qty+'" oninput="draft['+i+'].qty=Number(this.value)">'+btn('ลบ',"draft.splice("+i+",1);render()",true)+'</div>').join('')+'</div><div class="actions">'+btn('+ เพิ่มรายการ',"draft.push({product:'',qty:1});render()",true)+'</div>'}
function productMatches(query){const norm=v=>String(v).normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');const tokens=query.trim().split(/\s+/).map(norm).filter(Boolean);return S.products.filter(p=>tokens.every(t=>norm([p.code,p.name,p.model].filter(Boolean).join(' ')).includes(t))).sort((a,b)=>Number(norm(b.code)===norm(query))-Number(norm(a.code)===norm(query)))}
function closeProductSearch(){document.querySelectorAll('.product-results').forEach(el=>el.innerHTML='');document.querySelectorAll('[id^="product-search-"]').forEach(el=>{el.setAttribute('aria-expanded','false');el.removeAttribute('aria-activedescendant')})}
function searchProducts(i,query){closeProductSearch();const input=$('product-search-'+i),list=$('product-results-'+i);if(!input||!list)return;const matches=productMatches(query);input.dataset.active='-1';input.setAttribute('aria-expanded','true');list.innerHTML=matches.slice(0,50).map((p,n)=>'<button type="button" role="option" aria-selected="false" id="product-option-'+i+'-'+n+'" data-product="'+esc(p.id)+'" onmousedown="event.preventDefault()" onclick="chooseProduct('+i+',this.dataset.product)">'+esc(pname(p.id))+'</button>').join('')+'<div class="muted">'+(!matches.length?'ไม่พบสินค้าในทะเบียน':matches.length>50?'พบ '+matches.length+' รายการ แสดง 50 รายการแรก — พิมพ์เพิ่มเพื่อจำกัดผลค้นหา':'พบ '+matches.length+' รายการ')+'</div>'}
function chooseProduct(i,id){if(!product(id)||!draft[i])return;draft[i].product=id;const input=$('product-search-'+i);input.value=pname(id);closeProductSearch();input.closest('.itemline').querySelector('input[type="number"]').focus()}
function productSearchKey(event,i){const input=$('product-search-'+i),list=$('product-results-'+i);if(event.key==='Escape'){closeProductSearch();return}if(!['ArrowDown','ArrowUp','Enter'].includes(event.key))return;event.preventDefault();if(!list.children.length)searchProducts(i,input.value);const options=[...list.querySelectorAll('[data-product]')];if(!options.length)return;let n=Number(input.dataset.active??-1);if(event.key==='Enter'){if(n<0)n=0;chooseProduct(i,options[n].dataset.product);return}n=event.key==='ArrowDown'?Math.min(n+1,options.length-1):Math.max(n-1,0);input.dataset.active=String(n);options.forEach((el,j)=>el.setAttribute('aria-selected',String(j===n)));input.setAttribute('aria-activedescendant',options[n].id);options[n].scrollIntoView({block:'nearest'})}
document.addEventListener('click',event=>{if(!event.target.closest('.product-picker'))closeProductSearch()});

let stockQuery='',stockFrom='',stockTo='',stockMode='products';
function warehouseStock(){const reserved=new Map,locked=new Set;for(const o of S.orders.filter(o=>['open','awaiting_approval'].includes(o.status)))for(const x of o.alloc){const n=!x.done?x.qty:x.deferredDeduction&&!x.stockDeducted?(x.actual||0):0;const key=x.box+'|'+x.product;reserved.set(key,(reserved.get(key)||0)+n)}for(const c of S.counts){if(c.status==='open')c.boxes.forEach(id=>locked.add(id));if(c.status==='review')c.results.forEach(r=>locked.add(r.box))}const rows=new Map(S.products.map(p=>[p.id,{product:p,qty:0,reserved:0,available:0,locked:0,incoming:0,boxes:[]} ]));for(const b of S.boxes){if(!['pending','review','ready'].includes(b.status))continue;for(const x of b.items){const row=rows.get(x.product);if(!row||x.qty<=0)continue;const ready=b.status==='ready',booked=ready?(reserved.get(b.id+'|'+x.product)||0):0,free=ready?Math.max(0,x.qty-booked):0,blocked=ready&&locked.has(b.id),available=blocked?0:free;row.boxes.push({id:b.id,lot:b.lot,date:S.lots.find(l=>l.id===b.lot)?.date||'',qty:x.qty,reserved:booked,available,status:blocked?'อยู่ระหว่างตรวจนับ':status(b.status),ready,locked:blocked?free:0});if(ready){row.qty+=x.qty;row.reserved+=booked;row.available+=available;row.locked+=blocked?free:0}else row.incoming+=x.qty}}return [...rows.values()]}
function stockDetail(row){return table(['เลขลัง','ล็อต','วันที่รับเข้า','สถานะ','จำนวน / ชิ้น','จองเบิก','พร้อมเบิก'],row.boxes.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).map(b=>[esc(b.id),esc(b.lot),b.date?date(b.date):'—',esc(b.status),b.qty,b.reserved,b.available]))}
function stockFilterError(){return stockFrom&&stockTo&&stockFrom>stockTo}
function filteredStock(){
 if(stockFilterError())return [];
 const words=stockQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
 return warehouseStock().map(r=>{
  const prod=[r.product.code,r.product.name,r.product.model].join(' ').toLowerCase();
  const boxes=r.boxes.filter(b=>{
   if((stockFrom&&b.date<stockFrom)||(stockTo&&b.date>stockTo))return false;
   const lot=S.lots.find(l=>l.id===b.lot),info=lot?approvalInfo(lot):{};
   const text=[prod,b.id,b.lot,userName(info.by),b.date,b.date?date(b.date):''].join(' ').toLowerCase();
   return words.every(w=>text.includes(w));
  });
  const row={...r,boxes,qty:0,reserved:0,available:0,locked:0,incoming:0};
  for(const b of boxes){if(b.ready){row.qty+=b.qty;row.reserved+=b.reserved;row.available+=b.available;row.locked+=b.locked||0}else row.incoming+=b.qty}
  return boxes.length||(!stockFrom&&!stockTo&&words.every(w=>prod.includes(w)))?row:null;
 }).filter(Boolean);
}
function stockGroups(mode=stockMode){
 const groups=new Map;
 for(const r of filteredStock())for(const b of r.boxes){const key=mode==='lots'?b.lot:b.id;let g=groups.get(key);if(!g){g={id:key,lot:b.lot,date:b.date,qty:0,reserved:0,locked:0,available:0,incoming:0,boxes:new Set,lines:[]};groups.set(key,g)}
  g.boxes.add(b.id);g.lines.push({...b,product:r.product});if(b.ready){g.qty+=b.qty;g.reserved+=b.reserved;g.locked+=b.locked||0;g.available+=b.available}else g.incoming+=b.qty;
 }
 return [...groups.values()].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
}

 }))}

function orderDateKey(o){if(!o.created)return '';const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(o.created)).map(p=>[p.type,p.value]));return p.year+'-'+p.month+'-'+p.day}
function filteredOrders(){const tokens=orderQuery.toLowerCase().trim().split(/ +/).filter(Boolean);return S.orders.filter(o=>{const day=orderDateKey(o),text=[o.id,userName(o.by),...o.items.map(x=>pname(x.product)),...o.alloc.map(x=>x.box)].join(' ').toLowerCase();return(orderFilter==='all'||(orderFilter==='active'?['open','awaiting_approval'].includes(o.status):o.status===orderFilter))&&(!orderFrom||day>=orderFrom)&&(!orderTo||day<=orderTo)&&tokens.every(t=>text.includes(t))}).slice().sort((a,b)=>(b.created||'').localeCompare(a.created||''))}
function orderDetail(o){return '<div class="order-detail"><div class="receive-section-title"><div><b>'+esc(o.id)+'</b><p class="muted">ผู้สร้าง '+esc(userName(o.by||'—'))+'</p></div>'+badge(o.status)+'</div>'+table(['ลัง / ล็อต','สินค้า','ต้องหยิบ','หยิบจริง','ผล / หมายเหตุ','ผู้หยิบ'],o.alloc.map(x=>[esc(x.box)+'<br><small class="muted">'+esc(S.boxes.find(b=>b.id===x.box)?.lot||'')+'</small>',esc(pname(x.product)),x.qty,x.done?(x.actual??0):'—',x.done?(x.reason?esc(x.reason)+(x.note?'<br>'+esc(x.note):''):'บันทึกแล้ว'):'รอหยิบ',esc(userName(x.by||'—'))]))+(o.status==='awaiting_approval'?'<div class="actions"><p>ตรวจรายการและยอดหยิบจริงก่อนยืนยัน ระบบจะตัดตามยอดหยิบจริง</p>'+btn('ยืนยันและตัดสต็อก',"approveOrder('"+o.id+"')")+'</div>':'')+(o.approvedBy?'<p class="muted">ยืนยันตัดสต็อกโดย '+esc(userName(o.approvedBy))+' · '+new Date(o.approvedAt).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})+'</p>':'')+(o.status==='open'?'<div class="actions">'+btn('ยกเลิกเฉพาะส่วนที่ยังไม่หยิบ',"cancelOrder('"+o.id+"')",true)+'</div>':'')+'</div>'}
function toggleOrderDetail(id){orderDetailId=orderDetailId===id?'':id;updateOrderRows()}
function updateOrderRows(){if($('orderRows'))$('orderRows').innerHTML=orderSummaryTable()}
function setOrderFilter(value){orderFilter=value;orderPage=0;orderDetailId='';render()}
function searchOrders(value){orderQuery=value;orderPage=0;updateOrderRows()}
function orderSummaryTable(){const all=filteredOrders(),pages=Math.max(1,Math.ceil(all.length/15));orderPage=Math.min(orderPage,pages-1);const rows=all.slice(orderPage*15,orderPage*15+15);if(orderFrom&&orderTo&&orderFrom>orderTo)return '<div class="alert">วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด</div>';return (rows.length?'<div class="scroll"><table class="order-summary"><thead><tr>'+['ใบเบิก / วันที่','สินค้า','ขอเบิก / ชิ้น','หยิบแล้ว / ชิ้น','ความคืบหน้า','สถานะ',''].map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+rows.map(o=>{const requested=o.items.reduce((n,x)=>n+x.qty,0),actual=o.alloc.reduce((n,x)=>n+(x.done?(x.actual||0):0),0),done=o.alloc.filter(x=>x.done).length;return '<tr><td><b>'+esc(o.id)+'</b><small class="muted" style="display:block">'+(o.created?new Date(o.created).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'short',timeStyle:'short'}):'—')+'</small></td><td>'+o.items.length+' รายการ</td><td>'+requested+'</td><td>'+actual+'</td><td>'+(o.status==='cancelled'?'ยุติรายการ':o.status==='open'&&done===o.alloc.length?'รอพนักงานยืนยันจบ':done+' / '+o.alloc.length+' รายการ')+'</td><td>'+badge(o.status)+'</td><td>'+btn(orderDetailId===o.id?'ซ่อน ▴':'รายละเอียด ▾',"toggleOrderDetail('"+o.id+"')",true)+'</td></tr>'+(orderDetailId===o.id?'<tr><td colspan="7">'+orderDetail(o)+'</td></tr>':'')}).join('')+'</tbody></table></div>':empty('ไม่มีใบเบิกตรงตามตัวกรอง'))+'<div class="receive-pagination"><span class="muted">'+all.length+' ใบเบิก'+(all.length?' · แสดง '+(orderPage*15+1)+'–'+Math.min((orderPage+1)*15,all.length):'')+'</span><div>'+(orderPage>0?btn('ก่อนหน้า','orderPage--;updateOrderRows()',true):'')+' <span>'+(orderPage+1)+' / '+pages+'</span> '+(orderPage+1<pages?btn('ถัดไป','orderPage++;updateOrderRows()',true):'')+'</div></div>'}
function adminOrders(){if(orderCreating)return '<div class="actions">'+btn('← กลับรายการใบเบิก','closeOrderCreate()',true)+'</div><div class="card order-create"><h2>สร้างใบเบิกใหม่</h2><p class="muted">เลือกสินค้าและจำนวน ระบบจัดลังเก่าและจองยอดให้โดยอัตโนมัติ</p>'+itemEditor()+'<div class="actions">'+btn('สร้างใบเบิกและส่งงานให้พนักงาน','submitOrder()')+btn('ยกเลิก','closeOrderCreate()',true)+'</div></div>';return '<div class="count-toolbar"><p class="muted">ติดตามงานปัจจุบัน ค้นประวัติ และเปิดรายละเอียดเฉพาะใบที่ต้องการ</p>'+btn('+ สร้างใบเบิกใหม่','startOrderCreate()')+'</div><div class="card"><div class="receive-tabs">'+[['active','กำลังดำเนินการ'],['open','กำลังหยิบ'],['awaiting_approval','รอแอดมินยืนยัน'],['completed','เสร็จแล้ว'],['cancelled','ยกเลิก'],['all','ทั้งหมด']].map(([value,label])=>'<button class="'+(value===orderFilter?'active':'')+'" onclick="setOrderFilter(\''+value+'\')">'+label+' <b>'+S.orders.filter(o=>value==='all'||(value==='active'?['open','awaiting_approval'].includes(o.status):o.status===value)).length+'</b></button>').join('')+'</div><div class="order-filters"><label>ค้นหา<input aria-label="ค้นหาใบเบิก" placeholder="เลขใบเบิก / สินค้า / เลขลัง / ผู้สร้าง" value="'+esc(orderQuery)+'" oninput="searchOrders(this.value)"></label><label>ตั้งแต่วันที่<input type="date" value="'+orderFrom+'" onchange="orderFrom=this.value;orderPage=0;updateOrderRows()"></label><label>ถึงวันที่<input type="date" value="'+orderTo+'" onchange="orderTo=this.value;orderPage=0;updateOrderRows()"></label>'+btn('ล้างตัวกรอง',"orderQuery='';orderFrom='';orderTo='';orderPage=0;render()",true)+'</div><div id="orderRows">'+orderSummaryTable()+'</div></div>'}
async function openPick(line){if(qrScanner){const q=qrScanner;qrScanner=null;try{await q.stop()}catch(e){}}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}selectedRecord=line;render()}
function orderList(worker){return S.orders.filter(o=>!worker||o.status==='open').slice().reverse().map(o=>'<div class="card"><h2>'+esc(o.id)+' '+badge(o.status)+'</h2><p>บันทึกแล้ว '+o.alloc.filter(x=>x.done).length+' / '+o.alloc.length+' รายการ</p>'+(worker?o.alloc.map(x=>'<div class="card" style="margin:8px 0;padding:14px"><b>'+esc(pname(x.product))+'</b><p>ลัง <b>'+esc(x.box)+'</b><br><small>'+esc(S.boxes.find(b=>b.id===x.box)?.lot)+'</small></p><p>ต้องหยิบ <b>'+x.qty+'</b> ชิ้น</p>'+(x.done?'<span class="badge green">✓ บันทึกแล้ว '+x.actual+' ชิ้น</span>'+(x.reason?'<p>'+esc(x.reason)+'</p>':''):o.status==='open'?(selectedRecord===x.id?pickForm(o):btn('สแกนลังเพื่อหยิบ',"openPick('"+x.id+"')")):'')+'</div>').join(''):table(['ลัง / ล็อต','สินค้า','ต้องหยิบ','ผล'],o.alloc.map(x=>[esc(x.box)+'<br><small>'+esc(S.boxes.find(b=>b.id===x.box)?.lot)+'</small>',esc(pname(x.product)),x.qty,x.done?'หยิบจริง '+x.actual+(x.reason?'<br>'+esc(x.reason):''):'รอหยิบ'])))+(worker&&o.status==='open'&&o.alloc.length&&o.alloc.every(x=>x.done)?'<div class="actions">'+btn('ยืนยันหยิบครบ ส่งแอดมิน',"completePick('"+o.id+"')")+'</div>':worker&&o.status==='open'?'<p class="muted">สแกนและบันทึกให้ครบทุกรายการ จึงจะยืนยันการเบิกได้</p>':'')+(!worker&&o.status==='open'?btn('ยกเลิกส่วนที่ยังไม่หยิบ',"cancelOrder('"+o.id+"')",true):'')+'</div>').join('')||'<div class="card">'+empty('ยังไม่มีใบเบิก')+'</div>'}
function pickForm(o){const x=o.alloc.find(x=>x.id===selectedRecord),verified=x.scan&&(U.id?x.scan.user===U.id:x.scan.by===U.email),target='pick:'+o.id+':'+x.id;return '<div class="pick-inline">'+(verified?'<p class="badge green">✓ สแกนลังตรงแล้ว</p><form id="pickForm"><input type="hidden" name="order" value="'+o.id+'"><input type="hidden" name="line" value="'+x.id+'"><input type="hidden" name="scan" value="'+x.box+'"><input type="hidden" name="scanToken" value="'+x.scan.token+'"><label>หยิบจริง / ชิ้น<input name="actual" type="number" inputmode="numeric" min="0" max="'+x.qty+'" placeholder="กรอกจำนวนที่หยิบจริง" required></label><label>เหตุผลกรณีหยิบไม่ครบ<select name="reason"><option value="">เลือกเหตุผล</option><option>ของไม่พอในลัง</option><option>ของเสียหาย</option><option>สินค้าไม่ตรง</option><option>อื่น ๆ</option></select></label><label>หมายเหตุ<textarea name="note"></textarea></label><button>บันทึกจำนวนที่หยิบ</button></form>':'<p>เดินไปที่ลัง แล้วเปิดกล้องสแกนบาร์โค้ดให้ตรง จึงจะกรอกจำนวนหยิบได้</p><input id="scanInput" type="hidden">'+btn('เปิดกล้องสแกนลัง',"camera('"+target+"')")+'')+'</div>'}
async function verifyPickScan(target,code){const [,order,line]=target.split(':');await action('verifyPickScan',{order,line,scan:code.trim().toUpperCase()})}
function approveOrder(order){if(confirm('ยืนยันตัดสต็อกตามจำนวนหยิบจริง?'))action('approveOrder',{order})}
function completePick(order){if(confirm('ยืนยันหยิบครบและส่งแอดมินตรวจตัดสต็อก?'))action('completePick',{order})}

function countEditor(c){const b=S.boxes.find(b=>b.id===selectedRecord);if(!b||!c.boxes.includes(b.id)||c.results.some(r=>r.box===b.id)||c.status!=='open')return '';return '<div class="card"><h2>'+b.id+'</h2><form id="countForm"><input type="hidden" name="count" value="'+c.id+'"><input type="hidden" name="box" value="'+b.id+'">'+(b.touched?b.items.map(x=>'<label>'+esc(pname(x.product))+'<input data-count-product="'+x.product+'" type="number" min="0" required placeholder="จำนวนจริง (ใส่ 0 ได้)"></label>').join(''):'<p>ลังไม่เคยเบิก ยืนยันพบโดยใช้ยอดเดิม</p>')+'<button>ยืนยันผลตรวจนับ</button></form></div>'}
function bind(){if($('phoneUserForm'))$('phoneUserForm').onsubmit=e=>{e.preventDefault();submitPhoneUser(e.target)};if($('ownerProfileForm'))$('ownerProfileForm').onsubmit=e=>{e.preventDefault();action('ownerProfile',Object.fromEntries(new FormData(e.target)))};const forms={replacementForm:['replacementBox',[]],lotForm:['lot',['qty']],productForm:['product',[]],userForm:['member',[]],moveForm:['move',['qty']],pickForm:['pick',['actual']]};for(const [fid,[a,nums]]of Object.entries(forms)){if($(fid))$(fid).onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));nums.forEach(n=>p[n]=Number(p[n]));if(a==='pick')p.scan=p.scan.trim().toUpperCase();await action(a,p)}}if($('countForm'))$('countForm').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));p.items=[...e.target.querySelectorAll('[data-count-product]')].map(x=>({product:x.dataset.countProduct,qty:Number(x.value)}));if(await action('count',p)){selectedRecord='';render()}}}
async function submitReceive(){if(!draft.length||draft.some(x=>!x.product||!Number.isSafeInteger(x.qty)||x.qty<1)){toast('เลือกสินค้าและใส่จำนวนเต็มมากกว่าศูนย์ให้ครบ');return}if(await action('receive',{box:selectedRecord,items:draft})){selectedRecord='';draft=[];render()}}async function submitOrder(){if(!draft.length||draft.some(x=>!x.product||!Number.isSafeInteger(x.qty)||x.qty<1)){toast('เลือกสินค้าและใส่จำนวนเต็มมากกว่าศูนย์ให้ครบ');return}if(await action('order',{items:draft})){draft=[];orderCreating=false;orderFilter='active';orderPage=0;render()}}function approveLot(lot){if(confirm('อนุมัติทั้งล็อตและเปิดให้เบิก?'))action('approveLot',{lot})}function approveCount(count){if(confirm('อนุมัติปรับยอดเฉพาะลังที่ตรวจพบ? ลังที่ไม่พบจะคงยอดเดิม'))action('approveCount',{count})}function cancelOrder(order){if(confirm('ยกเลิกเฉพาะยอดที่ยังไม่ได้หยิบ? ยอดที่หยิบแล้วจะส่งรอแอดมินยืนยันตัดสต็อก'))action('cancelOrder',{order})}
function barcode(value){const codes={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','B':'nnwnnwnnw','*':'nwnnwnwnn'};let x=12,r='';for(const c of '*'+value+'*'){const pattern=codes[c];for(let i=0;i<9;i++){const w=pattern[i]==='w'?3:1;if(i%2===0)r+='<rect x="'+x+'" y="0" width="'+w+'" height="55"/>';x+=w}x++}return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x+12)+' 55" preserveAspectRatio="none">'+r+'</svg>'}
function printLabels(lot){$('print').innerHTML=S.boxes.filter(b=>b.lot===lot).map(b=>'<section class="label"><div>ล็อต '+esc(lot)+'</div><strong>'+b.id+'</strong>'+barcode(b.id)+'<div>วันที่รับเข้า '+date(S.lots.find(l=>l.id===lot).date)+'</div><div class="writearea"></div></section>').join('');window.print()}
function exportCSV(){const rows=[['รหัสสินค้า','ชื่อสินค้า','รุ่น','ล็อต','เลขลัง','คงเหลือชิ้น']];for(const b of S.boxes.filter(b=>b.status==='ready'))for(const x of b.items){const p=product(x.product);rows.push([p.code,p.name,p.model,b.lot,b.id,x.qty])}const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='warehouse-stock.csv';a.click();URL.revokeObjectURL(a.href)}
load();
</script></html>
